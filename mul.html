<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>곱셈 심화 검수지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Stitch C 시안 구조: 위 막대(제목·진행) / 왼쪽 문제 패널 / 오른쪽 입력 패널. 평평한 흰 패널, 가는 테두리, 굵은 숫자.
   색은 앱 C 테마(복숭아·로즈·라벤더) */
:root {
  --bg: #fbf3f0;
  --panel: #ffffff;
  --soft: #f8efed;
  --line: #ecdedd;
  --ink: #3f2f37;
  --ink-soft: #7a6670;
  --accent: #ad4766;
  --accent-ink: #ffffff;
  --accent-wash: #fbe5e9;
  --lav: #69517c;
  --lav-wash: #efe8f6;
  --good: #1d8457;
  --good-wash: #e2f3ea;
  --pen: #c53434;
  --pen-wash: #fdeaea;
  --blue: #3a5fc8;
  --warn: #a86400;
  --warn-wash: #fdf0da;
  --grid: #f1e3e5;
  --font: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1b1418;
    --panel: #251c21;
    --soft: #2e2329;
    --line: #3d2f36;
    --ink: #f3e7ec;
    --ink-soft: #b9a5ae;
    --accent: #f08aa8;
    --accent-ink: #2a1219;
    --accent-wash: #46242f;
    --lav: #cbb4e2;
    --lav-wash: #30283a;
    --good: #5fd49d;
    --good-wash: #183528;
    --pen: #ff7a7a;
    --pen-wash: #3a2024;
    --blue: #8eaaff;
    --warn: #f0b45a;
    --warn-wash: #3a2c14;
    --grid: #33262c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1418;
  --panel: #251c21;
  --soft: #2e2329;
  --line: #3d2f36;
  --ink: #f3e7ec;
  --ink-soft: #b9a5ae;
  --accent: #f08aa8;
  --accent-ink: #2a1219;
  --accent-wash: #46242f;
  --lav: #cbb4e2;
  --lav-wash: #30283a;
  --good: #5fd49d;
  --good-wash: #183528;
  --pen: #ff7a7a;
  --pen-wash: #3a2024;
  --blue: #8eaaff;
  --warn: #f0b45a;
  --warn-wash: #3a2c14;
  --grid: #33262c;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.65;
  word-break: keep-all; overflow-wrap: anywhere; /* 한국어는 단어 중간에서 줄을 바꾸지 않는다 */
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 위 막대 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  max-width: 1180px; margin: 0 auto; padding-block: 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 900; font-size: 17px;
}
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
.brand p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
.bar { width: 140px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.progress b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.save-state { font-size: 12px; color: var(--ink-soft); }

/* 본문 두 칸 */
.stage {
  max-width: 1180px; margin: 18px auto 0;
  display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start;
}
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

/* 문제 패널 */
.qpanel { position: relative; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-right: 76px; }
.chip { font-size: 12px; font-weight: 500; border-radius: 6px; padding: 3px 9px; border: 1px solid var(--line); color: var(--ink-soft); }
.chip.fill { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.stars { color: var(--warn); border-color: var(--warn-wash); background: var(--warn-wash); }
.chip.lav { color: var(--lav); border-color: var(--lav-wash); background: var(--lav-wash); }
.qtitle { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.sheet-area { position: relative; display: flex; flex-direction: column; gap: 16px; }
.q { margin: 0; font-size: 19px; line-height: 1.75; font-weight: 500; text-wrap: pretty; max-width: 40em; }

/* 식: 회색 상자 안의 굵은 숫자 */
.formula { background: var(--soft); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-x: auto; }
.formula .line { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.expr { display: inline-flex; align-items: center; gap: .3em; font-size: 34px; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.expr .op { font-weight: 500; color: var(--ink-soft); font-size: .78em; }
.blank { display: inline-block; width: 1.25em; height: 1.25em; border: 2px solid var(--line); border-radius: 8px; background: var(--panel); }
.mark { font-size: 17px; font-weight: 500; color: var(--ink-soft); }
.brace { font-size: 13px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--panel); }
.choices { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.choice {
  width: 100%; min-height: 56px; position: relative; z-index: 3; /* 펜을 켜도 누를 수 있게 쓰기 층 위에 둔다 */
  background: var(--soft); border: 2px solid transparent; border-radius: 10px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; white-space: nowrap; text-align: left;
}
.choices .expr { font-size: 25px; }

/* 숫자 카드 */
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; background: var(--soft); border-radius: 10px; padding: 18px; }
.ncard {
  width: 62px; height: 84px; border-radius: 8px; background: var(--panel); border: 1.5px solid var(--ink);
  display: grid; grid-template-rows: auto 1fr auto; padding: 4px 7px; user-select: none;
  transform: rotate(var(--tilt)); transition: transform .2s ease;
}
.ncard:hover { transform: rotate(0deg) translateY(-4px); }
.ncard .big { font-size: 40px; font-weight: 900; line-height: 1; place-self: center; color: var(--accent); }
.ncard .corner { font-size: 12px; font-weight: 700; line-height: 1; }
.ncard .end { justify-self: end; transform: rotate(180deg); }

/* 숫자 카드 판 (Konva) */
.board { background: var(--soft); border-radius: 10px; overflow: hidden; min-height: 120px; }

/* 답 줄: 식 안 빈칸(.inline)은 쓰기 층 위에 두어 펜을 켜도 누를 수 있다 */
.ansrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.ans-label { font-size: 15px; font-weight: 700; color: var(--accent); }
.ans-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.ans-field { display: inline-flex; align-items: center; gap: 6px; }
.ans-text { font-size: 17px; font-weight: 500; }
.ans-text.hint { font-size: 14px; color: var(--ink-soft); }
.ans-in {
  width: 5.2em; height: 52px; padding: 0 6px; font: inherit; font-size: 24px; font-weight: 900; text-align: center;
  font-variant-numeric: tabular-nums; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
}
.ans-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.ans-in.inline { width: 3.4em; height: 1.6em; font-size: .82em; position: relative; z-index: 3; }
.opt { min-height: 48px; min-width: 60px; padding: 0 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--soft); font-size: 17px; font-weight: 700; }
.opt[aria-pressed="true"], .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
.check { min-height: 52px; padding: 0 22px; border: 0; border-radius: 8px; background: var(--ink); color: var(--panel); font-size: 16px; font-weight: 700; }
.hint-btn { min-height: 52px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--lav); background: var(--lav-wash); color: var(--lav); font-size: 15px; font-weight: 700; }
.hint-btn:disabled { opacity: .55; cursor: default; }
.hints { flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px; }
.hints:empty { display: none; }
.hint { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--lav-wash); color: var(--ink); font-size: 15px; line-height: 1.6; }
.hint b { color: var(--lav); margin-right: 4px; }
.verdict { font-size: 15px; font-weight: 700; }
.verdict[data-v="correct"] { color: var(--good); }
.verdict[data-v="wrong"] { color: var(--pen); }
.verdict[data-v="empty"] { color: var(--ink-soft); font-weight: 500; }
.child-ans { margin: -6px 0 0; font-size: 13px; color: var(--ink-soft); }
.child-ans b { color: var(--ink); }
.child-ans[data-v="correct"] { color: var(--good); }
.child-ans[data-v="wrong"] { color: var(--pen); }

/* 풀이 칸과 쓰기 층 */
.work {
  height: 325px; border-radius: 10px; border: 1px solid var(--line); position: relative;
  background-color: var(--panel);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 36px 36px;
}
.work::before { content: attr(data-label); position: absolute; top: 4px; left: 10px; font-size: 12px; color: var(--ink-soft); }
.ink-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
body.ink-on { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.ink-on .ink-layer { pointer-events: auto; touch-action: none; cursor: crosshair; }
body.ink-on .sheet-area { box-shadow: 0 0 0 3px var(--accent-wash); border-radius: 10px; }

.inkbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.inkbar .sep { flex: 1; }
.tbtn {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); font-size: 14px;
  display: inline-grid; place-items: center;
}
.tbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
.tbtn.ink-toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tbtn.k { color: var(--ink); } .tbtn.r { color: var(--pen); } .tbtn.b { color: var(--blue); }
.swatch { width: 18px; height: 18px; border-radius: 50%; background: currentColor; }
.tbtn.danger[data-armed="true"] { background: var(--pen-wash); color: var(--pen); border-color: var(--pen); }

.reveal-row { display: flex; justify-content: center; }
.reveal { border: 0; background: var(--good-wash); color: var(--good); border-radius: 99px; padding: 6px 16px; font-size: 13px; font-weight: 500; }
.answer { background: var(--soft); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.answer .a { color: var(--pen); font-weight: 700; font-size: 17px; }
.answer .tip { color: var(--ink-soft); font-size: 14px; }
.concepts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 2px; font-size: 13px; color: var(--ink-soft); }
.ctag { padding: 2px 9px; border-radius: 999px; background: var(--lav-wash, var(--soft)); color: var(--ink); font-weight: 700; font-size: 13px; }
.weak { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.weak .ctag b { color: var(--pen); font-variant-numeric: tabular-nums; margin-left: 3px; }
.steps { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
.steps th, .steps td { text-align: left; vertical-align: top; padding: 6px 8px; border-top: 1px solid var(--line); }
.steps th { white-space: nowrap; color: var(--ink-soft); font-weight: 500; width: 6em; }

/* 맞힘 도장 */
.stamp {
  position: absolute; top: 12px; right: 14px; z-index: 3; width: 64px; height: 64px; border-radius: 50%;
  border: 2.5px solid var(--pen); color: var(--pen); background: var(--panel);
  display: grid; place-items: center; text-align: center;
  font-size: 12px; font-weight: 900; line-height: 1.15;
  transform: rotate(-14deg); pointer-events: none;
}
.qpanel.pop .stamp { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }

/* 오른쪽 입력 패널 */
.side { padding: 16px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); }
.side h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); display: flex; justify-content: space-between; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  min-height: 52px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft);
  font-size: 15px; font-weight: 700;
}
.key[aria-pressed="true"][data-v="correct"] { background: var(--good-wash); border-color: var(--good); color: var(--good); }
.key[aria-pressed="true"][data-v="wrong"],
.key[aria-pressed="true"][data-v="gaveup"] { background: var(--pen-wash); border-color: var(--pen); color: var(--pen); }
.key[aria-pressed="true"][data-v="easy"] { background: var(--lav-wash); border-color: var(--lav); color: var(--lav); }
.key[aria-pressed="true"][data-v="ok"] { background: var(--good-wash); border-color: var(--good); color: var(--good); }
.key[aria-pressed="true"][data-v="hard"] { background: var(--warn-wash); border-color: var(--warn); color: var(--warn); }
textarea {
  width: 100%; min-height: 76px; resize: vertical; font: inherit; font-size: 14px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.nav { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
.prev { min-height: 52px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
.next { min-height: 52px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; }
.prev:disabled, .next:disabled { opacity: .4; cursor: default; }
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dot {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 12px; font-weight: 500; color: var(--ink-soft); display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.dot[data-r="correct"] { background: var(--good-wash); border-color: var(--good); color: var(--good); }
.dot[data-r="wrong"], .dot[data-r="gaveup"] { background: var(--pen-wash); border-color: var(--pen); color: var(--pen); }
.dot[data-r="seen"] { border-color: var(--ink-soft); color: var(--ink); }
.dot { position: relative; }
.dot[data-ink="true"]::after { content: "✎"; position: absolute; top: 1px; right: 3px; font-size: 11px; line-height: 1; color: var(--accent); }
.dot[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.tally { display: flex; gap: 12px; font-size: 13px; color: var(--ink-soft); }
.tally b { font-weight: 700; font-variant-numeric: tabular-nums; }
.tally .g b { color: var(--good); } .tally .p b { color: var(--pen); } .tally .w b { color: var(--warn); }

/* 아래 이동 막대: 휴대폰에서만 보인다 */
.mnav { display: none; }

/* 반응형 규칙(기획 문서 「반응형 규칙」): 모바일 <768 · 태블릿 768~1279 · PC ≥1280 */
/* 태블릿(아이패드 세로·가로): 두 칸 유지, 오른쪽 패널을 좁힌다 */
@media (max-width: 1279px) {
  .stage { grid-template-columns: minmax(0, 1fr) 272px; gap: 12px; }
  .expr { font-size: 30px; }
  .key { min-height: 48px; }
}
/* 휴대폰: 한 칸으로 쌓고, 이동 버튼은 화면 아래에 고정 */
@media (max-width: 767px) {
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .topbar { padding-block: 10px; gap: 6px 12px; }
  .brand p { display: none; }
  .save-state { width: 100%; }
  .stage { grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
  .side { position: static; }
  .side .nav { display: none; }
  .work { height: 289px; }
  .mnav {
    display: grid; grid-template-columns: 76px 1fr; gap: 8px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-top: 1px solid var(--line);
  }
}
@media (max-width: 480px) {
  .qpanel { padding: 14px; }
  .qhead { padding-right: 60px; }
  .qtitle { width: 100%; margin-left: 0; }
  .tbtn { min-width: 40px; padding: 0 9px; font-size: 13px; }
  .q { font-size: 17px; }
  .expr { font-size: 26px; }
  .choices .expr { font-size: 21px; }
  .ncard { width: 52px; height: 72px; }
  .ans-in { font-size: 21px; width: 4.6em; }
  .ans-in.inline { width: 3.2em; }
  .check, .hint-btn { flex: 1 1 0; }
  .ncard .big { font-size: 33px; }
  .stamp { width: 52px; height: 52px; font-size: 10px; }
  .bar { width: 90px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">×</span>
    <div>
      <h1>곱셈 심화 검수지</h1>
      <p>3-2 · 1단원 곱셈 · 21문제</p>
    </div>
  </div>
  <div class="progress" aria-live="polite">
    <span>검수</span>
    <span class="bar"><i id="bar-fill" style="width:0%"></i></span>
    <b id="s-done">0 / 21</b>
  </div>
  <span class="save-state" id="save-state">저장소에 연결하는 중…</span>
</header>

<main class="stage">
  <section class="panel qpanel" id="qpanel" aria-live="polite"></section>
  <aside class="panel side" id="side" aria-label="검수 기록"></aside>
</main>

<nav class="mnav" aria-label="문제 이동">
  <button type="button" class="prev" id="m-prev">이전</button>
  <button type="button" class="next" id="m-next">다음 문제</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/10.0.12/konva.min.js"></script>
<script>
const P = [
  { id: 'p01', part: 'A', n: 1, stars: 1, title: '숫자 카드 — 가장 큰 곱', strat: '조건 따지기',

P.forEach((p, i) => { p.orig = p.n; p.n = i + 1; });
const LEVEL_NAME = { 1: '★ 응용', 2: '★★ 심화', 3: '★★★ 도전' };
const RESULT = [['correct', '맞힘'], ['wrong', '틀림'], ['gaveup', '못 풂']];
const LEVEL = [['easy', '쉬움'], ['ok', '적당'], ['hard', '어려움']];

const state = {};      // id → { result, level, note }
const revealed = new Set();
let justMarked = null; // 방금 맞힘으로 표시한 문제. 이때만 도장 애니메이션
let col = null;        // db collection, null이면 이 브라우저에만 저장
const saveEl = document.getElementById('save-state');

function loadLocal() {
  try { Object.assign(state, JSON.parse(localStorage.getItem('mul-review') || '{}')); } catch {}
}
function saveLocal() {
  try { localStorage.setItem('mul-review', JSON.stringify(state)); } catch {}
}
function el(tag, attrs = {}, html) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (html != null) e.innerHTML = html;
  return e;
}

// 식: 숫자는 크게, 연산 기호는 연하게, □는 실제 빈칸으로 그린다
function mathHTML(expr) {
  return expr.split(' ').map((t) => {
    if (t === '□') return '<span class="blank" aria-label="빈칸"></span>';
    if (t === '▢') return '<span class="ans-here"></span>';
    if (/^[×÷+−<>=]$/.test(t)) return `<span class="op">${t === '<' ? '&lt;' : t === '>' ? '&gt;' : t}</span>`;
    if (t === '…') return '<span class="op">…</span>';
    return `<span class="nm">${t}</span>`;
  }).join('');
}
function formulaEl(p) {
  if (p.choices) {
    const grid = el('ol', { class: 'choices' });
    const d = draftOf(p);
    p.choices.forEach((c, i) => {
      const b = el('button', { type: 'button', class: 'choice', id: `choice-${i}`, 'aria-pressed': String(d[0] === String(i + 1)) },
        `<span class="mark">${'①②③④⑤'[i]}</span><span class="expr">${mathHTML(c)}</span>`);
      b.addEventListener('click', () => {
        d[0] = String(i + 1);
        grid.querySelectorAll('.choice').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i)));
        clearVerdict();
      });
      const li = el('li');
      li.append(b);
      grid.append(li);
    });
    return grid;
  }
  const box = el('div', { class: 'formula' });
  p.f.forEach((expr, i) => {
    const line = el('div', { class: 'line' });
    if (p.labels) line.append(el('span', { class: 'mark' }, p.labels[i]));
    line.append(el('span', { class: 'expr' }, mathHTML(expr)));
    box.append(line);
  });
  if (p.note) {
    const line = box.lastChild;
    line.append(el('span', { class: 'brace' }, p.note));
  }
  let k = 0;
  box.querySelectorAll('.ans-here').forEach((s) => s.replaceWith(ansInput(p, k++, 'ans-in inline')));
  return box;
}

// ── 답 넣기 ──
// 풀이는 펜으로 쓰고, 답은 칸에 넣어 확인한다. 펜으로 쓴 풀이는 채점하지 않는다
const drafts = {}; // id → 아직 확인하지 않은 답
const norm = (v) => String(v ?? '').replace(/[\s,]/g, '');

function draftOf(p) {
  return (drafts[p.id] ||= p.ans.map((_, i) => state[p.id]?.ans?.[i] ?? ''));
}
function ansInput(p, i, cls) {
  const f = p.ans[i], d = draftOf(p);
  const name = f.label || f.unit || (p.ans.length > 1 ? `${i + 1}번째` : '');
  const inp = el('input', { class: cls, id: `ans-${i}`, type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': `답 ${name}`.trim() });
  inp.value = d[i];
  inp.addEventListener('input', () => { d[i] = inp.value; clearVerdict(); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAns(p); });
  return inp;
}
function ansText(p, vals) {
  return p.ans.map((f, i) => {
    const v = vals?.[i] ?? '';
    if (f.choice) return '①②③④⑤'[Number(v) - 1] || v;
    return [f.label, v + (f.unit || '')].filter(Boolean).join(' ');
  }).join(', ');
}
function ansRow(p) {
  const row = el('div', { class: 'ansrow' });
  const fields = el('div', { class: 'ans-fields' });
  const d = draftOf(p);
  p.ans.forEach((f, i) => {
    if (f.inline || f.choice) return;
    const g = el('span', { class: 'ans-field' });
    if (f.label) g.append(el('span', { class: 'ans-text' }, f.label));
    if (f.opts) {
      f.opts.forEach((o, j) => {
        const b = el('button', { type: 'button', class: 'opt', id: `opt-${i}-${j}`, 'aria-pressed': String(d[i] === o) }, o);
        b.addEventListener('click', () => {
          d[i] = o;
          g.querySelectorAll('.opt').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          clearVerdict();
        });
        g.append(b);
      });
    } else g.append(ansInput(p, i, 'ans-in'));
    if (f.unit) g.append(el('span', { class: 'ans-text' }, f.unit));
    fields.append(g);
  });
  if (!fields.children.length) fields.append(el('span', { class: 'ans-text hint' }, p.choices ? '보기를 고르고 확인' : '식의 빈칸에 쓰고 확인'));
  // 힌트는 눌러야 한 단계씩 열린다. 써도 감점 없이 몇 단계까지 봤는지만 기록한다
  const used = state[p.id]?.hint || 0;
  const hintBtn = el('button', { type: 'button', class: 'hint-btn', id: 'hint-btn' }, used >= 2 ? '힌트 다 봤어요' : `힌트 ${used + 1}`);
  hintBtn.disabled = used >= 2;
  hintBtn.addEventListener('click', () => {
    const next = Math.min(2, (state[p.id]?.hint || 0) + 1);
    write(p.id, { hint: next });
    showHints(p);
  });
  const btn = el('button', { type: 'button', class: 'check', id: 'check' }, '확인');
  btn.addEventListener('click', () => checkAns(p));
  const verdict = el('span', { class: 'verdict', id: 'verdict', role: 'status' });
  const s = state[p.id] || {};
  if (s.check && p.ans.every((_, i) => norm(d[i]) === norm(s.ans?.[i]))) setVerdict(verdict, s.check);
  row.append(el('span', { class: 'ans-label' }, '답'), fields, hintBtn, btn, verdict, el('div', { class: 'hints', id: 'hints', 'aria-live': 'polite' }));
  return row;
}
function showHints(p) {
  const box = document.getElementById('hints');
  const used = state[p.id]?.hint || 0;
  const b = document.getElementById('hint-btn');
  if (b) { b.disabled = used >= 2; b.textContent = used >= 2 ? '힌트 다 봤어요' : `힌트 ${used + 1}`; }
  if (!box) return;
  box.replaceChildren(...p.hints.slice(0, used).map((h, i) => {
    const d = el('p', { class: 'hint' });
    d.append(el('b', {}, `힌트 ${i + 1}`), document.createTextNode(' ' + h));
    return d;
  }));
}
function setVerdict(v, kind) {
  v.dataset.v = kind;
  v.textContent = { correct: '○ 맞았어요', wrong: '× 다시 생각해 봐요', empty: '빈칸을 모두 채워 주세요' }[kind];
}
function clearVerdict() {
  const v = document.getElementById('verdict');
  if (v) { v.textContent = ''; delete v.dataset.v; }
}
function checkAns(p) {
  const d = draftOf(p);
  if (d.some((v) => !norm(v))) { setVerdict(document.getElementById('verdict'), 'empty'); return; }
  const ok = p.ans.every((f, i) => norm(d[i]) === norm(f.a));
  const s = state[p.id] || {};
  const patch = { ans: d.map(norm), check: ok ? 'correct' : 'wrong', tries: (s.tries || 0) + 1 };
  if (!s.first) patch.first = patch.check;
  if (ok && !s.result) patch.result = 'correct';
  write(p.id, patch);
}

// ── 숫자 카드 놓기 (Konva) ──
// 카드를 끌어 빈칸에 놓거나, 카드를 누른 뒤 빈칸을 누른다. 놓인 카드를 누르면 제자리로 돌아간다.
// 빈칸이 다 차면 곱이 바로 보인다. 펜을 켜면 쓰기 층이 위를 덮어 카드는 움직이지 않는다
const boards = {}; // id → 빈칸마다 놓인 카드 번호(없으면 null)
let stageNow = null;

function boardValue(p, placed) {
  if (placed.includes(null)) return { msg: '카드를 빈칸에 놓아 보세요' };
  let at = 0;
  const nums = p.board.map((g) => {
    const ds = placed.slice(at, at += g).map((i) => p.cards[i]);
    return ds;
  });
  if (nums.some((ds) => ds.length > 1 && ds[0] === 0)) return { msg: '맨 앞에는 0을 놓을 수 없어요' };
  if (nums.some((ds) => ds.length === 1 && ds[0] === 0)) return { msg: '한 자리 수에는 0을 놓을 수 없어요' };
  return { value: nums.map((ds) => Number(ds.join(''))).reduce((a, b) => a * b) };
}

function drawBoard(p) {
  stageNow?.destroy();
  stageNow = null;
  const box = document.getElementById('board');
  if (!box || !window.Konva) return;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ink: css('--ink'), panel: css('--panel'), soft: css('--ink-soft'), accent: css('--accent'), font: css('--font') };
  const W = box.clientWidth, small = W < 420;
  const cw = small ? 52 : 62, ch = small ? 72 : 84, gap = small ? 8 : 12, opW = small ? 26 : 34, sg = 6;
  const nSlots = p.board.reduce((a, b) => a + b, 0);
  const placed = (boards[p.id] ||= Array(nSlots).fill(null));

  // 위 줄은 카드 자리, 아래 줄은 빈칸. 수와 수 사이에 ×
  const trayY = 14 + ch / 2;
  const trayW = p.cards.length * cw + (p.cards.length - 1) * gap;
  const home = p.cards.map((_, i) => ({ x: (W - trayW) / 2 + cw / 2 + i * (cw + gap), y: trayY }));
  const slotY = trayY + ch + (small ? 20 : 26);
  const rowW = nSlots * cw + (nSlots - p.board.length) * sg + (p.board.length - 1) * opW;
  const slots = [], ops = [];
  let x = (W - rowW) / 2;
  p.board.forEach((g, gi) => {
    if (gi) { ops.push(x + opW / 2); x += opW; }
    for (let k = 0; k < g; k++) { slots.push({ x: x + cw / 2, y: slotY }); x += cw + (k < g - 1 ? sg : 0); }
  });
  const H = slotY + ch / 2 + (small ? 54 : 62);

  const stage = new Konva.Stage({ container: box, width: W, height: H });
  const layer = new Konva.Layer();
  stage.add(layer);
  stageNow = stage;
  const motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 0.16;
  let selected = null;

  slots.forEach((s, j) => {
    const r = new Konva.Rect({ x: s.x - cw / 2, y: s.y - ch / 2, width: cw, height: ch, cornerRadius: 8, fill: C.panel, stroke: C.soft, strokeWidth: 1.5, dash: [6, 5] });
    r.on('click tap', () => {
      if (selected == null) return;
      const from = placed.indexOf(selected);
      if (from >= 0) placed[from] = placed[j];
      placed[j] = selected;
      selected = null;
      update(true);
    });
    layer.add(r);
  });
  ops.forEach((ox) => layer.add(new Konva.Text({ x: ox - opW / 2, y: slotY - 15, width: opW, align: 'center', text: '×', fontSize: small ? 24 : 28, fontFamily: C.font, fill: C.soft })));
  const result = new Konva.Text({ x: 0, y: slotY + ch / 2 + 14, width: W, align: 'center', fontFamily: C.font });
  layer.add(result);

  const tilt = [-4, 3, -2, 4, -3];
  const cards = p.cards.map((d, i) => {
    const g = new Konva.Group({ draggable: true, offsetX: cw / 2, offsetY: ch / 2 });
    g.bg = new Konva.Rect({ width: cw, height: ch, cornerRadius: 8, fill: C.panel, stroke: C.ink, strokeWidth: 1.5 });
    const t = (s, size, style, fill) => new Konva.Text({ text: String(d), fontSize: size, fontStyle: style, fontFamily: C.font, fill });
    const big = t(d, small ? 34 : 40, '900', C.accent);
    big.setAttrs({ width: cw, height: ch, align: 'center', verticalAlign: 'middle' });
    const c1 = t(d, 12, 'bold', C.ink);
    c1.setAttrs({ x: 7, y: 5 });
    const c2 = t(d, 12, 'bold', C.ink);
    c2.setAttrs({ x: cw - 7, y: ch - 5, rotation: 180 });
    g.add(g.bg, big, c1, c2);
    g.dragBoundFunc((pos) => ({ x: Math.min(W - cw / 2, Math.max(cw / 2, pos.x)), y: Math.min(H - ch / 2, Math.max(ch / 2, pos.y)) }));
    g.on('dragstart', () => { selected = null; g.moveToTop(); update(false); });
    g.on('dragend', () => {
      const pos = g.position();
      let j = -1, best = cw * 0.75;
      slots.forEach((s, k) => { const dd = Math.hypot(s.x - pos.x, s.y - pos.y); if (dd < best) { best = dd; j = k; } });
      const from = placed.indexOf(i);
      if (from >= 0) placed[from] = null;
      if (j >= 0) {
        const occ = placed[j];
        if (occ != null && from >= 0) placed[from] = occ; // 빈칸끼리 옮기면 자리를 바꾼다
        placed[j] = i;
      }
      update(true);
    });
    g.on('click tap', () => {
      const s = placed.indexOf(i);
      if (selected != null && selected !== i && s >= 0) {
        const from = placed.indexOf(selected);
        if (from >= 0) placed[from] = i;
        placed[s] = selected;
        selected = null;
      } else if (s >= 0 && selected == null) {
        placed[s] = null;
      } else {
        selected = selected === i ? null : i;
      }
      update(true);
    });
    g.on('mouseenter', () => { box.style.cursor = 'grab'; });
    g.on('mouseleave', () => { box.style.cursor = ''; });
    layer.add(g);
    return g;
  });

  function update(animate) {
    cards.forEach((g, i) => {
      const s = placed.indexOf(i);
      const to = s >= 0 ? { ...slots[s], rotation: 0 } : { ...home[i], rotation: tilt[i % 5] };
      if (i === selected) to.y -= 8;
      if (animate && motion && !g.isDragging()) g.to({ ...to, duration: motion });
      else if (!g.isDragging()) g.setAttrs(to);
      g.bg.stroke(i === selected ? C.accent : C.ink);
      g.bg.strokeWidth(i === selected ? 3 : 1.5);
    });
    const v = boardValue(p, placed);
    if (v.msg) result.setAttrs({ text: v.msg, fontSize: small ? 14 : 15, fontStyle: 'normal', fill: C.soft });
    else result.setAttrs({ text: `= ${v.value}`, fontSize: small ? 26 : 30, fontStyle: '900', fill: C.ink });
    box.setAttribute('aria-label', `숫자 카드 ${p.cards.join(', ')}. ${v.msg || '만든 곱 ' + v.value}`);
  }
  update(false);
}

function cardsEl(p) {
  const row = el('div', { class: 'cards', role: 'img', 'aria-label': `숫자 카드 ${p.cards.join(', ')}` });
  p.cards.forEach((d, i) => {
    row.append(el('div', { class: 'ncard', 'aria-hidden': 'true', style: `--tilt:${[-4, 3, -2, 4, -3][i % 5]}deg` },
      `<span class="corner">${d}</span><span class="big">${d}</span><span class="corner end">${d}</span>`));
  });
  return row;
}

// ── 풀이 쓰기 ──
// 문제 카드 위에 투명한 캔버스를 덮어 학습지에 쓰듯 바로 적는다.
// 좌표는 쓰기 영역 너비를 1000으로 맞춘 단위로 저장해 기기마다 같은 비율로 다시 그린다.
// 한 점은 [x, y, 앞 점과의 시간 간격 ms]. 획은 '색 x,y,dt x,y,dt …', 획끼리는 '|'로 잇는다
const UNIT = 1000;
const MAX_CHARS = 240000; // 문서 한 개 256KiB 제한 안쪽
const sketches = {}; // id → 획 배열
let sketchCol = null;
let canvases = {}; // id → { cv, ctx, scale }
const ink = { on: false, tool: 'k', penSeen: false, cur: null, pointer: null, lastT: null, active: null, scroll: null, pending: false, undo: {}, playing: {}, saveT: {}, dirty: new Set() };

function encode(strokes) {
  return strokes.map((s) => s.c + ' ' + s.p.map((q) => q.join(',')).join(' ')).join('|');
}
function decode(str) {
  if (!str) return [];
  return str.split('|').map((part) => {
    const [c, ...pts] = part.split(' ');
    return { c, p: pts.map((t) => t.split(',').map(Number)) };
  }).filter((s) => s.p.length);
}
function colorOf(c) {
  const name = c === 'r' ? '--pen' : c === 'b' ? '--blue' : '--ink';
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function strokePath(g, s, upto = s.p.length) {
  const p = s.p;
  g.strokeStyle = colorOf(s.c); g.lineWidth = 3.4; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(p[0][0], p[0][1]);
  if (upto === 1) g.lineTo(p[0][0] + 0.01, p[0][1]);
  for (let i = 1; i < upto; i++) g.lineTo(p[i][0], p[i][1]);
  g.stroke();
}
function clearCanvas(c) {
  c.ctx.save(); c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.cv.width, c.cv.height); c.ctx.restore();
}
function redraw(id) {
  const c = canvases[id];
  if (!c) return;
  clearCanvas(c);
  for (const s of sketches[id] || []) strokePath(c.ctx, s);
}
function sizeCanvas(id) {
  const c = canvases[id];
  const r = c.cv.parentElement.getBoundingClientRect();
  if (!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  c.cv.width = Math.round(r.width * dpr);
  c.cv.height = Math.round(r.height * dpr);
  c.scale = r.width / UNIT;
  c.ctx.setTransform(dpr * c.scale, 0, 0, dpr * c.scale, 0, 0);
  redraw(id);
}

async function saveSketch(id) {
  if (!ink.dirty.has(id)) return;
  ink.dirty.delete(id);
  const data = encode(sketches[id] || []);
  try { localStorage.setItem('mul-sketch-' + id, data); } catch {}
  const n = P.find((q) => q.id === id).n;
  if (data.length > MAX_CHARS) { saveEl.textContent = `${n}번 풀이가 길어 저장 공간을 넘었어요. 필요 없는 부분을 지우면 다시 저장돼요.`; return; }
  if (!sketchCol) return;
  saveEl.textContent = '풀이 저장하는 중…';
  try {
    await sketchCol.doc(id).set({ data, unit: UNIT, strokes: (sketches[id] || []).length, order: n, updatedAt: new Date().toISOString() });
    saveEl.textContent = `${n}번 풀이 저장됨`;
  } catch {
    saveEl.textContent = `${n}번 풀이를 저장소에 올리지 못했어요. 이 브라우저에는 남아 있고, 한 획 더 쓰면 다시 시도해요.`;
  }
}
// 펜 풀이가 있는 문제 번호에 연필 표시
function markDot(d, q) {
  const has = (sketches[q.id] || []).length > 0;
  d.dataset.ink = String(has);
  d.setAttribute('aria-label', `${q.n}번${has ? ', 펜 풀이 있음' : ''}`);
}
function refreshDot(id) {
  const i = P.findIndex((q) => q.id === id);
  const d = document.getElementById('dot-' + i);
  if (d) markDot(d, P[i]);
}
function changed(id) {
  refreshDot(id);
  ink.dirty.add(id);
  clearTimeout(ink.saveT[id]);
  ink.saveT[id] = setTimeout(() => saveSketch(id), 1500);
}
function pushUndo(id) {
  const stack = (ink.undo[id] ||= []);
  stack.push((sketches[id] || []).slice());
  if (stack.length > 40) stack.shift();
}
function eraseAt(id, x, y) {
  const list = sketches[id] || [];
  const next = list.filter((s) => !s.p.some((q) => Math.hypot(q[0] - x, q[1] - y) < 14));
  if (next.length !== list.length) { sketches[id] = next; ink.cur.erased = true; redraw(id); }
}

function attachCanvas(id, area) {
  const cv = el('canvas', { class: 'ink-layer', 'aria-label': '풀이를 적는 곳' });
  area.append(cv);
  const c = { cv, ctx: cv.getContext('2d'), scale: 1 };
  canvases[id] = c;
  const pointOf = (e) => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / c.scale, (e.clientY - r.top) / c.scale];
  };
  cv.addEventListener('pointerdown', (e) => {
    if (!ink.on || ink.cur || ink.scroll || ink.playing[id]) return;
    if (e.pointerType === 'pen' && !ink.penSeen) {
      ink.penSeen = true;
      saveEl.textContent = '펜슬을 찾았어요. 이제 펜슬로는 쓰고, 손가락으로는 화면을 넘겨요.';
    }
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    if (ink.penSeen && e.pointerType === 'touch') { ink.scroll = { pointer: e.pointerId, y: e.clientY }; return; }
    ink.pointer = e.pointerId;
    ink.active = id;
    pushUndo(id);
    const [x, y] = pointOf(e);
    if (ink.tool === 'e') { ink.cur = { erase: true, id }; eraseAt(id, x, y); return; }
    const now = performance.now();
    const dt = ink.lastT == null ? 0 : Math.min(Math.round(now - ink.lastT), 60000);
    ink.lastT = now;
    ink.cur = { c: ink.tool, p: [[Math.round(x), Math.round(y), dt]], id };
    (sketches[id] ||= []).push(ink.cur);
    strokePath(c.ctx, ink.cur);
  });
  cv.addEventListener('pointermove', (e) => {
    if (ink.scroll && e.pointerId === ink.scroll.pointer) {
      window.scrollBy(0, ink.scroll.y - e.clientY);
      ink.scroll.y = e.clientY;
      return;
    }
    if (!ink.cur || ink.cur.id !== id || e.pointerId !== ink.pointer) return;
    const list = e.getCoalescedEvents?.() || [];
    for (const ev of list.length ? list : [e]) {
      const [x, y] = pointOf(ev);
      if (ink.cur.erase) { eraseAt(id, x, y); continue; }
      const p = ink.cur.p, last = p[p.length - 1];
      if (Math.hypot(x - last[0], y - last[1]) < 1.5) continue;
      const now = performance.now();
      p.push([Math.round(x), Math.round(y), Math.round(now - ink.lastT)]);
      ink.lastT = now;
      strokePath(c.ctx, { c: ink.cur.c, p: [last, p[p.length - 1]] });
    }
  });
  const end = (e) => {
    if (ink.scroll && e.pointerId === ink.scroll.pointer) { ink.scroll = null; }
    else if (ink.cur && ink.cur.id === id && e.pointerId === ink.pointer) {
      const wasErase = ink.cur.erase, erased = ink.cur.erased;
      ink.cur = null; ink.pointer = null;
      if (wasErase && !erased) ink.undo[id].pop();
      else changed(id);
    } else return;
    if (ink.pending) { ink.pending = false; render(); }
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

// 재생: 적은 순서대로 다시 그린다. 오래 멈춘 구간은 0.7초로 줄이고 1.5배속
function stopPlay(id) {
  if (!ink.playing[id]) return;
  cancelAnimationFrame(ink.playing[id]);
  delete ink.playing[id];
  redraw(id);
}
function play(id) {
  if (ink.playing[id]) { stopPlay(id); return; }
  const list = sketches[id] || [];
  if (!list.length || !canvases[id]) return;
  const events = [];
  let t = 0;
  list.forEach((s, si) => s.p.forEach((q, pi) => { t += Math.min(q[2], pi === 0 ? 700 : 120); events.push([t, si, pi]); }));
  const start = performance.now();
  let k = 0;
  const tick = (now) => {
    const c = canvases[id];
    if (!c) { delete ink.playing[id]; return; }
    const elapsed = (now - start) * 1.5;
    while (k < events.length && events[k][0] <= elapsed) k++;
    clearCanvas(c);
    if (k > 0) {
      const [, si, pi] = events[k - 1];
      for (let i = 0; i < si; i++) strokePath(c.ctx, list[i]);
      strokePath(c.ctx, list[si], pi + 1);
    }
    if (k >= events.length) { delete ink.playing[id]; return; }
    ink.playing[id] = requestAnimationFrame(tick);
  };
  ink.playing[id] = requestAnimationFrame(tick);
}
function clearSketch(id) {
  stopPlay(id);
  pushUndo(id);
  sketches[id] = [];
  ink.active = id;
  redraw(id);
  changed(id);
}

let boardW = 0;
window.addEventListener('resize', () => {
  for (const id of Object.keys(canvases)) sizeCanvas(id);
  const box = document.getElementById('board');
  if (box && box.clientWidth !== boardW) { boardW = box.clientWidth; drawBoard(P[cur]); }
});
// 글꼴이 늦게 오면 카드 숫자를 다시 그린다
document.fonts?.ready.then(() => { if (P[cur]?.board) drawBoard(P[cur]); });

for (const p of P) {
  try { const v = localStorage.getItem('mul-sketch-' + p.id); if (v) sketches[p.id] = decode(v); } catch {}
}


// ── 화면 ──
// 한 번에 한 문제. 왼쪽은 문제와 풀이, 오른쪽은 결과·난이도·메모와 이동
function setInk(on) {
  ink.on = on;
  document.body.classList.toggle('ink-on', on);
  const b = document.getElementById('ink-toggle');
  if (b) { b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '펜 쓰는 중' : '펜으로 쓰기'; }
}

function inkBar(p) {
  const bar = el('div', { class: 'inkbar', role: 'toolbar', 'aria-label': '펜 도구' });
  const toggle = el('button', { type: 'button', class: 'tbtn ink-toggle', id: 'ink-toggle', 'aria-pressed': String(ink.on) });
  toggle.textContent = ink.on ? '펜 쓰는 중' : '펜으로 쓰기';
  toggle.addEventListener('click', () => setInk(!ink.on));
  bar.append(toggle);
  for (const [t, label] of [['k', '검정 펜'], ['r', '빨간 펜'], ['b', '파란 펜'], ['e', '지우개']]) {
    const b = el('button', { type: 'button', class: `tbtn ${t}`, id: `t-${t}`, 'aria-pressed': String(ink.tool === t), 'aria-label': label },
      t === 'e' ? '지우개' : '<span class="swatch"></span>');
    b.addEventListener('click', () => {
      ink.tool = t;
      for (const u of ['k', 'r', 'b', 'e']) document.getElementById('t-' + u)?.setAttribute('aria-pressed', String(u === t));
      if (!ink.on) setInk(true);
    });
    bar.append(b);
  }
  const undo = el('button', { type: 'button', class: 'tbtn', id: 'ink-undo' }, '되돌리기');
  undo.addEventListener('click', () => {
    const id = p.id;
    if (!ink.undo[id]?.length || ink.cur) return;
    stopPlay(id);
    sketches[id] = ink.undo[id].pop();
    redraw(id);
    changed(id);
  });
  bar.append(undo, el('span', { class: 'sep' }));
  const playB = el('button', { type: 'button', class: 'tbtn', id: 'ink-play' }, '풀이 재생');
  playB.addEventListener('click', () => play(p.id));
  const clearB = el('button', { type: 'button', class: 'tbtn danger', id: 'ink-clear' }, '풀이 지우기');
  clearB.addEventListener('click', () => {
    if (!(sketches[p.id] || []).length) return;
    if (clearB.dataset.armed !== 'true') {
      clearB.dataset.armed = 'true';
      clearB.textContent = '한 번 더 누르면 지워요';
      setTimeout(() => { clearB.dataset.armed = 'false'; clearB.textContent = '풀이 지우기'; }, 3000);
      return;
    }
    clearSketch(p.id);
    clearB.dataset.armed = 'false'; clearB.textContent = '풀이 지우기';
  });
  bar.append(playB, clearB);
  return bar;
}

let cur = 0;
try { cur = Math.min(P.length - 1, Math.max(0, Number(localStorage.getItem('mul-review-cur')) || 0)); } catch {}

const qpanel = document.getElementById('qpanel');
const side = document.getElementById('side');

function renderQ() {
  if (ink.cur || ink.scroll) { ink.pending = true; return; }
  const p = P[cur], s = state[p.id] || {};
  for (const id of Object.keys(ink.playing)) stopPlay(id);
  canvases = {};
  qpanel.dataset.result = s.result || '';
  qpanel.classList.toggle('pop', p.id === justMarked);

  const head = el('div', { class: 'qhead' });
  head.append(
    el('span', { class: 'chip fill' }, `문제 ${p.n}/${P.length}`),
    el('span', { class: 'chip stars', 'aria-label': `난이도 별 ${p.stars}개` }, LEVEL_NAME[p.stars]),
    el('span', { class: 'chip lav' }, p.strat),
    el('span', { class: 'qtitle' }, p.title),
  );

  const area = el('div', { class: 'sheet-area' });
  area.append(el('p', { class: 'q' }, p.q));
  if (p.f || p.choices) area.append(formulaEl(p));
  if (p.cards) area.append(window.Konva && p.board ? el('div', { class: 'board', id: 'board', role: 'img' }) : cardsEl(p));
  area.append(el('div', { class: 'work', 'aria-hidden': 'true', 'data-label': `${p.n}번 풀이` }));
  attachCanvas(p.id, area);

  const parts = [head, area, inkBar(p), ansRow(p)];
  const open = revealed.has(p.id);
  const row = el('div', { class: 'reveal-row' });
  const btn = el('button', { type: 'button', class: 'reveal', 'aria-expanded': String(open), id: 'reveal' }, open ? '해설 접기' : '정답과 해설 보기');
  btn.addEventListener('click', () => { open ? revealed.delete(p.id) : revealed.add(p.id); renderQ(); });
  row.append(btn);
  parts.push(row);
  if (open) {
    const ans = el('div', { class: 'answer' });
    ans.append(el('div', { class: 'a' }, `정답 ${p.a}`), el('div', { class: 'tip' }, p.tip));
    if (p.concepts.length) ans.append(el('p', { class: 'concepts' }, '쓰인 개념 ' + p.concepts.map((c) => `<span class="ctag">${c}</span>`).join('')));
    if (p.steps) {
      const t = el('table', { class: 'steps' });
      for (const [h, d] of p.steps) t.append(el('tr', {}, `<th>${h}</th><td>${d}</td>`));
      ans.append(t);
    }
    parts.push(ans);
  }
  if (s.result === 'correct') parts.push(el('div', { class: 'stamp', 'aria-label': '참 잘했어요' }, '참<br>잘했어요'));
  qpanel.replaceChildren(...parts);
  showHints(p);
  sizeCanvas(p.id);
  if (p.board) drawBoard(p);
}
const render = renderQ; // 쓰기 중에 미뤄 둔 다시 그리기를 끝나고 실행

function keys(p, field, options, label) {
  const wrap = el('div', { class: 'keys', role: 'group', 'aria-label': label });
  for (const [v, text] of options) {
    const b = el('button', { type: 'button', class: 'key', 'data-v': v, 'aria-pressed': String(state[p.id]?.[field] === v), id: `${field}-${v}` });
    b.textContent = text;
    b.addEventListener('click', () => write(p.id, { [field]: state[p.id]?.[field] === v ? null : v }));
    wrap.append(b);
  }
  return wrap;
}

function renderSide() {
  const p = P[cur];
  const vals = P.map((q) => state[q.id] || {});
  const done = vals.filter((v) => v.result || v.level).length;
  document.getElementById('s-done').textContent = `${done} / ${P.length}`;
  document.getElementById('bar-fill').style.width = `${(done / P.length) * 100}%`;

  // 메모를 쓰는 중이면 패널을 다시 만들지 않는다
  if (document.activeElement?.id === 'note') return;

  const tally = el('div', { class: 'tally' },
    `<span class="g">맞힘 <b>${vals.filter((v) => v.result === 'correct').length}</b></span>` +
    `<span class="p">틀림·못 풂 <b>${vals.filter((v) => v.result === 'wrong' || v.result === 'gaveup').length}</b></span>` +
    `<span class="w">어려움 <b>${vals.filter((v) => v.level === 'hard').length}</b></span>`);
  // 틀리거나 못 푼 문제의 개념을 모아 몇 번 걸렸는지 보여 준다
  const weak = {};
  for (const q of P) if (['wrong', 'gaveup'].includes(state[q.id]?.result)) for (const c of q.concepts) weak[c] = (weak[c] || 0) + 1;
  const weakEl = Object.keys(weak).length ? el('div', { class: 'weak' }, '다시 볼 개념 ' + Object.entries(weak).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<span class="ctag">${c}<b>×${n}</b></span>`).join('')) : null;

  const ta = el('textarea', { id: 'note', placeholder: '예: 문제 뜻을 이해 못 함, 계산 실수, 힌트 주니 풂', 'aria-label': `${p.n}번 메모` });
  ta.value = state[p.id]?.note || '';
  let t;
  ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => write(p.id, { note: ta.value.trim() || null }, true), 700); });
  ta.addEventListener('blur', () => { clearTimeout(t); if ((state[p.id]?.note || '') !== ta.value.trim()) write(p.id, { note: ta.value.trim() || null }); });

  const nav = el('div', { class: 'nav' });
  const prev = el('button', { type: 'button', class: 'prev', id: 'prev' }, '이전');
  prev.disabled = cur === 0;
  prev.addEventListener('click', () => go(cur - 1));
  const next = el('button', { type: 'button', class: 'next', id: 'next' }, cur === P.length - 1 ? '마지막 문제예요' : '다음 문제');
  next.disabled = cur === P.length - 1;
  next.addEventListener('click', () => go(cur + 1));
  nav.append(prev, next);
  const mPrev = document.getElementById('m-prev'), mNext = document.getElementById('m-next');
  mPrev.disabled = prev.disabled; mNext.disabled = next.disabled;
  mNext.textContent = next.disabled ? '마지막 문제예요' : `다음 문제 (${p.n + 1}번)`;

  const dots = el('nav', { class: 'dots', 'aria-label': '문제로 바로 가기' });
  P.forEach((q, i) => {
    const r = state[q.id]?.result;
    const d = el('button', { type: 'button', class: 'dot', id: `dot-${i}`, 'data-r': r || (state[q.id]?.level ? 'seen' : ''), 'aria-current': String(i === cur), 'aria-label': `${q.n}번` });
    markDot(d, q);
    d.textContent = q.n;
    d.addEventListener('click', () => go(i));
    dots.append(d);
  });

  const s = state[p.id] || {};
  let childAns = null;
  const hintNote = s.hint ? ` · 힌트 ${s.hint}단계까지 봄` : '';
  if (s.check) {
    childAns = el('p', { class: 'child-ans', 'data-v': s.check });
    childAns.append('아이 답 ', el('b'), ` · ${s.check === 'correct' ? '○' : '×'} ${s.tries || 1}번 확인${s.first === 'correct' ? ', 첫 번에 맞힘' : ''}${hintNote}`);
    childAns.querySelector('b').textContent = ansText(p, s.ans);
  } else if (s.hint) {
    childAns = el('p', { class: 'child-ans' }, hintNote.slice(3));
  }

  side.replaceChildren(
    el('h2', {}, '아이 결과'), keys(p, 'result', RESULT, '아이 결과'), ...(childAns ? [childAns] : []),
    el('h2', {}, '난이도'), keys(p, 'level', LEVEL, '난이도'),
    el('h2', {}, '메모'), ta,
    nav,
    el('h2', {}, '<span>전체 문제</span>'), dots, tally, ...(weakEl ? [weakEl] : []),
  );
}

function go(i) {
  if (i < 0 || i >= P.length || i === cur) return;
  cur = i;
  try { localStorage.setItem('mul-review-cur', String(i)); } catch {}
  renderQ();
  renderSide();
  if (qpanel.getBoundingClientRect().top < 0) qpanel.scrollIntoView({ block: 'start' });
}
document.getElementById('m-prev').addEventListener('click', () => go(cur - 1));
document.getElementById('m-next').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('textarea, input')) return;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

async function write(id, patch, quiet) {
  const before = state[id]?.result;
  state[id] = { ...(state[id] || {}), ...patch };
  justMarked = patch.result === 'correct' ? id : null;
  saveLocal();
  if ((state[id].result !== before || 'check' in patch) && id === P[cur].id) renderQ();
  if (!quiet) renderSide();
  justMarked = null;
  if (!col) return;
  saveEl.textContent = '저장하는 중…';
  try {
    await col.doc(id).set({ ...state[id], concepts: P.find((q) => q.id === id).concepts, docNo: Number(id.slice(1)), order: P.find((q) => q.id === id).n, updatedAt: new Date().toISOString() });
    saveEl.textContent = '저장됨';
  } catch {
    saveEl.textContent = '저장하지 못했어요. 이 브라우저에만 남아 있으니 잠시 뒤 다시 눌러 주세요.';
  }
}

loadLocal();
renderQ();
renderSide();

(async () => {
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if (!db) {
    saveEl.textContent = '이 기기에만 저장돼요';
    return;
  }
  col = db.collection('reviews');
  sketchCol = db.collection('sketches');
  sketchCol.onSnapshot((snap) => {
    // 아직 올리지 않은 획이 있는 문제는 화면의 획이 최신이므로 덮어쓰지 않는다
    for (const d of snap.docs) {
      if (ink.dirty.has(d.id) || ink.cur?.id === d.id) continue;
      const data = d.data()?.data || '';
      sketches[d.id] = decode(data);
      try { localStorage.setItem('mul-sketch-' + d.id, data); } catch {}
      refreshDot(d.id);
      if (d.id === P[cur].id && !ink.playing[d.id]) redraw(d.id);
    }
  }, () => { sketchCol = null; });
  const timer = setTimeout(() => { saveEl.textContent = '저장소 응답이 늦어요'; }, 10000);
  col.onSnapshot((snap) => {
    clearTimeout(timer);
    const look = () => { const s = state[P[cur].id] || {}; return [s.result || null, s.check || null, s.tries || 0, s.hint || 0].join(); };
    const shown = look();
    for (const d of snap.docs) {
      const { result = null, level = null, note = null, ans = null, check = null, tries = 0, first = null, hint = 0 } = d.data() || {};
      state[d.id] = { result, level, note, ans, check, tries, first, hint };
      // 아직 아무것도 쓰지 않은 칸은 저장된 답으로 채운다
      if (drafts[d.id]?.every((v) => !norm(v))) delete drafts[d.id];
    }
    saveLocal();
    if (look() !== shown) renderQ();
    renderSide();
    if (!snap.metadata.hasPendingWrites) saveEl.textContent = '저장소에 연결됨';
  }, () => {
    clearTimeout(timer);
    col = null;
    saveEl.textContent = '저장소를 읽지 못해 이 기기에만 저장돼요';
  });
})();
</script>
